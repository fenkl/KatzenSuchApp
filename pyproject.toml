[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build.HatchlingBuild"

[project]
name = "katzensuchapp"
version = "0.1.0"
description = "KatzenSuchApp - Cat shelter scraper with Flet UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet>=1.0.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "aiohttp>=3.8.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
]

[project.scripts]
katzensuchapp-run = "flet_app.main:main"
katzensuchapp-scraper = "modules.services.orchestrator:main"

[tool.hatch.build.targets.wheel]
packages = ["modules", "flet_app", "classes"]

[tool.playwright]
browsers = ["firefox"]
